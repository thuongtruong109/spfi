name: spf

services:
  app:
    image: "${APP_IMAGE:-ghcr.io/sonidia/spfi:latest}"
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_ALLOWED_ORIGINS: "${SPFI_ALLOWED_ORIGINS:-}"
      NUXT_API_ORIGIN_REQUIRED: "${NUXT_API_ORIGIN_REQUIRED:-true}"
      NUXT_ADMIN_API_VERSION: "${NUXT_ADMIN_API_VERSION:-2026-07}"
      NUXT_API_RATE_LIMIT_PER_MINUTE: "${NUXT_API_RATE_LIMIT_PER_MINUTE:-600}"
      NUXT_TOKEN_RATE_LIMIT_PER_MINUTE: "${NUXT_TOKEN_RATE_LIMIT_PER_MINUTE:-0}"
      # nginx overwrites X-Forwarded-For with the direct client address.
      NUXT_TRUST_PROXY_HEADERS: "true"
      NUXT_ALLOW_HOST_ORIGIN_FALLBACK: "false"
      NUXT_ALLOW_PRIVATE_PROXY_HOSTS: "${NUXT_ALLOW_PRIVATE_PROXY_HOSTS:-false}"
      NUXT_DEBUG_PROXY_ENABLED: "${NUXT_DEBUG_PROXY_ENABLED:-false}"
      NUXT_DEBUG_PROXY_ALLOWED_HOSTS: "${NUXT_DEBUG_PROXY_ALLOWED_HOSTS:-httpbin.org,api.ipify.org}"
      NUXT_WEBHOOK_PUBLIC_URL: "${NUXT_WEBHOOK_PUBLIC_URL:-}"
      NUXT_WEBHOOK_ENCRYPTION_KEY: "${NUXT_WEBHOOK_ENCRYPTION_KEY:-}"
      NUXT_WEBHOOK_STREAM_MAX_CONNECTIONS: "${NUXT_WEBHOOK_STREAM_MAX_CONNECTIONS:-100}"
      NUXT_WEBHOOK_STREAM_MAX_CONNECTIONS_PER_IP: "${NUXT_WEBHOOK_STREAM_MAX_CONNECTIONS_PER_IP:-10}"
      NUXT_WEBHOOK_STREAM_MAX_CONNECTIONS_PER_SHOP: "${NUXT_WEBHOOK_STREAM_MAX_CONNECTIONS_PER_SHOP:-5}"
      NUXT_WEBHOOK_STREAM_MAX_LIFETIME_SECONDS: "${NUXT_WEBHOOK_STREAM_MAX_LIFETIME_SECONDS:-1800}"
      NITRO_WEBHOOK_STORAGE_PATH: "/app/.data/webhooks"
      NITRO_WEBHOOK_REDIS_URL: "${NITRO_WEBHOOK_REDIS_URL:-}"
      NITRO_WEBHOOK_REDIS_PREFIX: "${NITRO_WEBHOOK_REDIS_PREFIX:-spf:webhooks}"
      NUXT_PUBLIC_SHEET_URLS: "${NUXT_PUBLIC_SHEET_URLS:-}"
      NUXT_PUBLIC_MASTER_SHEET_URL: "${NUXT_PUBLIC_MASTER_SHEET_URL:-}"
      NUXT_PUBLIC_MASTER_SHEET_TABS: "${NUXT_PUBLIC_MASTER_SHEET_TABS:-}"
    expose:
      - "3000"
    volumes:
      - type: bind
        source: ./server/service_account.json
        target: /app/server/service_account.json
        read_only: true
      - type: volume
        source: webhook-data
        target: /app/.data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Plain HTTP is loopback-only by default. Terminate TLS at a trusted
      # reverse proxy before exposing this service outside the host.
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  webhook-data:
