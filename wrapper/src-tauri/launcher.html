<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spfi launcher</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "Segoe UI Variable Text",
          "Segoe UI",
          Aptos,
          system-ui,
          -apple-system,
          sans-serif;
        --bg: #f2f6f3;
        --surface: rgba(255, 255, 255, 0.92);
        --surface-solid: #fff;
        --surface-soft: #eef5f1;
        --surface-hover: #e4f0e9;
        --text: #13231b;
        --muted: #66776d;
        --line: #d8e4dc;
        --green: #18794e;
        --green-soft: #dff4e8;
        --red: #b4312b;
        --focus: 0 0 0 3px rgba(31, 122, 77, 0.16);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0d1410;
          --surface: rgba(21, 29, 24, 0.94);
          --surface-solid: #151d18;
          --surface-soft: #1d2b23;
          --surface-hover: #263a2e;
          --text: #edf5f0;
          --muted: #9dafa3;
          --line: #2d3d34;
          --green: #78d39e;
          --green-soft: #173a27;
          --red: #ff9188;
          --focus: 0 0 0 3px rgba(126, 214, 163, 0.18);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 18%, rgba(31, 162, 105, 0.13), transparent 28%),
          radial-gradient(circle at 82% 78%, rgba(39, 103, 157, 0.1), transparent 30%),
          linear-gradient(145deg, var(--bg), color-mix(in srgb, var(--bg) 88%, #fff));
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        position: fixed;
        inset: 38px 0 0;
        background-image:
          linear-gradient(
            color-mix(in srgb, var(--line) 42%, transparent) 1px,
            transparent 1px
          ),
          linear-gradient(
            90deg,
            color-mix(in srgb, var(--line) 42%, transparent) 1px,
            transparent 1px
          );
        background-size: 48px 48px;
        content: "";
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.42), transparent 78%);
        pointer-events: none;
      }

      button {
        font: inherit;
      }

      .titlebar {
        position: fixed;
        inset: 0 0 auto;
        z-index: 10;
        height: 38px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--surface-solid) 91%, transparent);
        user-select: none;
        backdrop-filter: blur(18px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 13px;
        font-size: 14px;
        font-weight: 720;
      }

      .brand-mark {
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: linear-gradient(145deg, #1f9a66, #147a51);
        color: #fff;
        font-size: 11px;
        box-shadow: 0 5px 14px rgba(20, 122, 81, 0.2);
      }

      .brand-name {
        background: linear-gradient(90deg, #16a085, #20c997, #0ea5a8);
        background-clip: text;
        color: transparent;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .titlebar-context {
        color: var(--muted);
        font-size: 11px;
        font-weight: 550;
      }

      .drag-region {
        height: 100%;
        flex: 1;
      }

      .window-controls {
        height: 100%;
        display: flex;
      }

      .window-controls button {
        width: 46px;
        height: 100%;
        display: grid;
        place-items: center;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: default;
        font-size: 16px;
      }

      .window-controls button:hover {
        background: var(--surface-hover);
        color: var(--text);
      }

      .window-controls button[data-window-action="close"]:hover {
        background: #c42b1c;
        color: #fff;
      }

      .launcher-card {
        position: relative;
        z-index: 1;
        width: min(520px, calc(100vw - 48px));
        padding: 36px;
        border: 1px solid color-mix(in srgb, var(--line) 82%, transparent);
        border-radius: 24px;
        background: var(--surface);
        box-shadow:
          0 28px 80px rgba(14, 32, 22, 0.13),
          0 2px 8px rgba(14, 32, 22, 0.05);
        backdrop-filter: blur(22px);
      }

      .launcher-kicker {
        width: fit-content;
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 14px;
        padding: 5px 9px;
        border: 1px solid color-mix(in srgb, var(--green) 26%, transparent);
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 13%, transparent);
      }

      h1 {
        margin: 0;
        font-family: "Segoe UI Variable Display", "Segoe UI", Aptos, sans-serif;
        font-size: clamp(27px, 4vw, 34px);
        font-weight: 720;
        letter-spacing: -0.035em;
        line-height: 1.08;
      }

      .launcher-intro {
        max-width: 420px;
        margin: 12px 0 26px;
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.65;
      }

      .field-label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .target-picker {
        position: relative;
      }

      .target-trigger {
        width: 100%;
        min-height: 64px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface-solid);
        color: var(--text);
        cursor: pointer;
        text-align: left;
        transition:
          border-color 0.16s ease,
          box-shadow 0.16s ease,
          transform 0.16s ease;
      }

      .target-trigger:hover,
      .target-trigger[aria-expanded="true"] {
        border-color: color-mix(in srgb, var(--green) 58%, var(--line));
        box-shadow: var(--focus);
      }

      .target-trigger:focus-visible,
      .target-option:focus-visible,
      .open-button:focus-visible {
        outline: none;
        box-shadow: var(--focus);
      }

      .target-symbol {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: var(--green-soft);
        color: var(--green);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .target-copy {
        min-width: 0;
        display: grid;
        gap: 3px;
      }

      .target-copy strong,
      .target-copy small {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .target-copy strong {
        font-size: 13.5px;
        font-weight: 700;
      }

      .target-copy small {
        color: var(--muted);
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 10.5px;
      }

      .chevron {
        width: 9px;
        height: 9px;
        margin-right: 5px;
        border-right: 1.8px solid currentColor;
        border-bottom: 1.8px solid currentColor;
        color: var(--muted);
        transform: translateY(-2px) rotate(45deg);
        transition: transform 0.16s ease;
      }

      .target-trigger[aria-expanded="true"] .chevron {
        transform: translateY(2px) rotate(225deg);
      }

      .target-menu {
        position: absolute;
        top: calc(100% + 7px);
        right: 0;
        left: 0;
        z-index: 4;
        display: grid;
        gap: 4px;
        max-height: 224px;
        overflow-y: auto;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface-solid);
        box-shadow: 0 20px 46px rgba(11, 28, 18, 0.18);
      }

      .target-menu[hidden] {
        display: none;
      }

      .target-option {
        width: 100%;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 11px;
        padding: 9px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        text-align: left;
      }

      .target-option:hover,
      .target-option[aria-selected="true"] {
        background: var(--surface-soft);
      }

      .target-check {
        color: var(--green);
        font-size: 16px;
        font-weight: 800;
      }

      .connection-note {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 10px 2px 0;
        color: var(--muted);
        font-size: 11.5px;
      }

      .connection-note svg {
        flex: 0 0 auto;
        color: var(--green);
      }

      .open-button {
        width: 100%;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin-top: 20px;
        border: 0;
        border-radius: 11px;
        background: linear-gradient(135deg, #1d8859, #146f49);
        color: #fff;
        cursor: pointer;
        font-size: 13px;
        font-weight: 720;
        box-shadow: 0 10px 24px rgba(20, 122, 81, 0.2);
        transition:
          box-shadow 0.16s ease,
          transform 0.16s ease;
      }

      .open-button:hover:not(:disabled) {
        box-shadow: 0 14px 30px rgba(20, 122, 81, 0.26);
        transform: translateY(-1px);
      }

      .open-button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .open-arrow {
        font-size: 17px;
        transition: transform 0.16s ease;
      }

      .open-button:hover .open-arrow {
        transform: translateX(2px);
      }

      .status {
        min-height: 18px;
        margin: 12px 2px 0;
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.45;
      }

      .status.error {
        color: var(--red);
      }

      @media (max-width: 560px) {
        .launcher-card {
          padding: 26px;
          border-radius: 18px;
        }

        .titlebar-context {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="titlebar">
      <div class="brand" data-tauri-drag-region>
        <span class="brand-mark" data-tauri-drag-region>S</span>
        <span class="brand-name" data-tauri-drag-region>Spfi</span>
      </div>
      <span class="titlebar-context" data-tauri-drag-region>Workspace launcher</span>
      <div class="drag-region" data-tauri-drag-region></div>
      <div class="window-controls" aria-label="Window controls">
        <button type="button" data-window-action="minimize" aria-label="Minimize">
          −
        </button>
        <button type="button" data-window-action="maximize" aria-label="Maximize">
          □
        </button>
        <button type="button" data-window-action="close" aria-label="Close">×</button>
      </div>
    </header>

    <main class="launcher-card">
      <div class="launcher-kicker"><span class="live-dot"></span> Desktop launcher</div>
      <h1>Connect to your workspace</h1>
      <p class="launcher-intro">
        Choose the Spfi environment you want to open. Every endpoint is checked before
        the WebView switches, so this launcher always stays recoverable.
      </p>

      <span class="field-label">Environment</span>
      <div id="picker" class="target-picker">
        <button
          id="target-trigger"
          class="target-trigger"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="target-menu"
        >
          <span id="selected-symbol" class="target-symbol">SP</span>
          <span class="target-copy">
            <strong id="selected-label">Select an environment</strong>
            <small id="selected-url">No endpoint selected</small>
          </span>
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <div id="target-menu" class="target-menu" role="listbox" hidden></div>
      </div>

      <div class="connection-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 3 4 6v5c0 5.2 3.4 8.7 8 10 4.6-1.3 8-4.8 8-10V6l-8-3Z"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="m9 12 2 2 4-4"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Rust verifies the connection before navigation.
      </div>

      <button id="open" class="open-button" type="button">
        <span>Open workspace</span><span class="open-arrow" aria-hidden="true">→</span>
      </button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      const targets = __SPFI_WEBVIEW_TARGETS__;
      const picker = document.querySelector("#picker");
      const trigger = document.querySelector("#target-trigger");
      const menu = document.querySelector("#target-menu");
      const selectedLabel = document.querySelector("#selected-label");
      const selectedUrl = document.querySelector("#selected-url");
      const selectedSymbol = document.querySelector("#selected-symbol");
      const openButton = document.querySelector("#open");
      const status = document.querySelector("#status");
      const invoke = window.__TAURI__.core.invoke;
      let selectedIndex = 0;

      function initials(label) {
        return label
          .split(/\s+/)
          .map((part) => part[0])
          .join("")
          .slice(0, 2)
          .toUpperCase();
      }

      function closeMenu() {
        menu.hidden = true;
        trigger.setAttribute("aria-expanded", "false");
      }

      function selectTarget(index, { focusTrigger = false } = {}) {
        const target = targets[index];
        if (!target) return;

        selectedIndex = index;
        selectedLabel.textContent = target.label;
        selectedUrl.textContent = target.url;
        selectedSymbol.textContent = initials(target.label);
        menu.querySelectorAll(".target-option").forEach((option, optionIndex) => {
          option.setAttribute("aria-selected", String(optionIndex === index));
          option.querySelector(".target-check").textContent =
            optionIndex === index ? "✓" : "";
        });
        closeMenu();
        if (focusTrigger) trigger.focus();
      }

      function openMenu() {
        menu.hidden = false;
        trigger.setAttribute("aria-expanded", "true");
        menu.querySelectorAll(".target-option")[selectedIndex]?.focus();
      }

      targets.forEach((target, index) => {
        const option = document.createElement("button");
        option.className = "target-option";
        option.type = "button";
        option.role = "option";
        option.setAttribute("aria-selected", "false");
        option.innerHTML = `
          <span class="target-symbol">${initials(target.label)}</span>
          <span class="target-copy"><strong></strong><small></small></span>
          <span class="target-check" aria-hidden="true"></span>`;
        option.querySelector("strong").textContent = target.label;
        option.querySelector("small").textContent = target.url;
        option.addEventListener("click", () =>
          selectTarget(index, { focusTrigger: true }),
        );
        option.addEventListener("keydown", (event) => {
          if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault();
            const direction = event.key === "ArrowDown" ? 1 : -1;
            const nextIndex = (index + direction + targets.length) % targets.length;
            menu.querySelectorAll(".target-option")[nextIndex]?.focus();
          }
        });
        menu.append(option);
      });

      if (targets.length) selectTarget(0);
      else {
        openButton.disabled = true;
        status.classList.add("error");
        status.textContent = "No WebView targets are configured.";
      }

      trigger.addEventListener("click", () => {
        if (menu.hidden) openMenu();
        else closeMenu();
      });
      trigger.addEventListener("keydown", (event) => {
        if (["ArrowDown", "ArrowUp", "Enter", " "].includes(event.key)) {
          event.preventDefault();
          openMenu();
        }
      });
      document.addEventListener("pointerdown", (event) => {
        if (!picker.contains(event.target)) closeMenu();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeMenu();
          trigger.focus();
        }
      });

      async function openTarget() {
        const target = targets[selectedIndex];
        if (!target) return;

        openButton.disabled = true;
        trigger.disabled = true;
        status.classList.remove("error");
        status.textContent = `Checking ${target.url}…`;

        try {
          await invoke("open_webview_url", { url: target.url });
        } catch (error) {
          status.classList.add("error");
          status.textContent = String(error);
          openButton.disabled = false;
          trigger.disabled = false;
        }
      }

      openButton.addEventListener("click", openTarget);

      for (const button of document.querySelectorAll("[data-window-action]")) {
        button.addEventListener("click", () => {
          invoke("control_window", { action: button.dataset.windowAction });
        });
      }
    </script>
  </body>
</html>
